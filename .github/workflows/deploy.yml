name: Bygg og Publiser til GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: Kjør enhetstester
        run: npm test

      - name: Bygg statisk webapp
        run: npm run build

      - name: Klargjør Pages artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
